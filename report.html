<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Executive Report — Data Analysis Workflow Hub</title>
  <meta name="description" content="Auto-generated, print-friendly executive report: dataset overview, quality audit, KPI metrics, insights and downloadable markdown / HTML / PDF (print-to-PDF).">
  <link rel="canonical" href="https://hmgacademyhub.github.io/dataanalysiswf/report.html">
  <meta name="robots" content="index,follow">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-content">
      <header id="topNav" class="top-nav"></header>
      <main class="page-container">

        <div class="flex justify-between items-center mb-4 no-print">
          <div>
            <h1 class="section-title">Executive Report</h1>
            <p class="section-sub">A board-ready summary of your dataset — derived directly from the live workspace.</p>
          </div>
          <div class="flex gap-2">
            <button id="btnPrint" class="btn btn-secondary"><i data-lucide="printer"></i> Print / PDF</button>
            <button id="btnMd"    class="btn btn-secondary"><i data-lucide="file-text"></i> Markdown</button>
            <button id="btnHtml"  class="btn btn-secondary"><i data-lucide="code"></i> HTML</button>
          </div>
        </div>

        <div id="noDataPanel" class="hidden"></div>

        <article id="report" class="card padded" style="max-width:880px; margin: 0 auto;"></article>

      </main>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script>
  (async function () {
    await DAWFUI.boot();
    if (!DAWF.state.dataset.length) {
      document.getElementById("report").classList.add("hidden");
      const npd = document.getElementById("noDataPanel"); npd.classList.remove("hidden");
      npd.innerHTML = DAWFUI.noDatasetCard(); if (window.lucide) lucide.createIcons();
      return;
    }

    const ov = DAWF.profiling.overview();
    const q  = DAWF.profiling.qualityScore();
    const nums = DAWF.utils.getNumericColumns();
    const top3 = nums.slice(0, 5).map(c => {
      const s = DAWF.profiling.columnStats(c);
      return { Column: c, Sum: s.sum, Avg: s.avg, Min: s.min, Max: s.max, Std: s.std };
    });
    const insights = [];
    if (ov.missingPct > 5) insights.push(`The dataset has ${ov.missingPct.toFixed(1)}% missing cells. Recommend imputation or column drop before publishing KPIs.`);
    if (q.duplicates > 0) insights.push(`${q.duplicates} duplicate rows detected — drop them in Clean &amp; Profile to avoid double-counting.`);
    if (q.outlierColumns > 0) insights.push(`${q.outlierColumns} numeric column(s) show outliers above 5% of rows — consider winsorising for stable averages.`);
    if (q.score >= 90) insights.push(`Quality score ${q.score}/100 — the dataset is publication-ready.`);
    if (top3.length) insights.push(`The largest numeric column by total is "${top3.sort((a,b)=>b.Sum-a.Sum)[0]?.Column}".`);

    const date = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    const brand = DAWF.state.brand;

    const html = `
      <header style="text-align:center; padding: 1rem 0 2rem; border-bottom: 2px solid var(--border);">
        <div style="font-size:48px;">${brand.logo}</div>
        <h1 style="margin:.4rem 0; font-size: 2.4rem; font-weight: 800;">${brand.name}</h1>
        <p class="text-muted">${brand.tagline}</p>
        <p class="text-muted text-xs">Report generated ${date} · ${brand.org}</p>
      </header>

      <section class="mt-6">
        <h2 style="font-weight:800;font-size:1.4rem;">1. Executive summary</h2>
        <p>Dataset <strong>${DAWF.state.activeFile || "(unnamed)"}</strong> was ingested, profiled and analysed in the Data Analysis Workflow Hub.
        It contains <strong>${ov.rowCount.toLocaleString()} rows</strong> across <strong>${ov.colCount} columns</strong>, totalling
        <strong>${ov.totalCells.toLocaleString()} cells</strong>. The overall data-quality score is <strong>${q.score}/100</strong>.</p>
      </section>

      <section class="mt-6">
        <h2 style="font-weight:800;font-size:1.4rem;">2. Data quality audit</h2>
        <div class="kpi-grid mt-2">
          <div class="kpi"><div class="kpi-label">Quality score</div><div class="kpi-value">${q.score}/100</div></div>
          <div class="kpi"><div class="kpi-label">Missing cells</div><div class="kpi-value">${ov.missingPct.toFixed(1)}%</div></div>
          <div class="kpi"><div class="kpi-label">Duplicates</div><div class="kpi-value">${q.duplicates}</div></div>
          <div class="kpi"><div class="kpi-label">Outlier columns</div><div class="kpi-value">${q.outlierColumns}</div></div>
        </div>
      </section>

      <section class="mt-6">
        <h2 style="font-weight:800;font-size:1.4rem;">3. Key numeric metrics</h2>
        <div class="data-table-container">
          <table class="data-table"><thead><tr><th>Column</th><th class="num">Sum</th><th class="num">Avg</th><th class="num">Min</th><th class="num">Max</th><th class="num">Std</th></tr></thead>
          <tbody>${top3.map(r => `<tr><td><strong>${r.Column}</strong></td><td class="num">${DAWF.fmtNum(r.Sum)}</td><td class="num">${DAWF.fmtNum(r.Avg)}</td><td class="num">${DAWF.fmtNum(r.Min)}</td><td class="num">${DAWF.fmtNum(r.Max)}</td><td class="num">${DAWF.fmtNum(r.Std)}</td></tr>`).join("")}</tbody></table>
        </div>
      </section>

      <section class="mt-6">
        <h2 style="font-weight:800;font-size:1.4rem;">4. Rule-based insights</h2>
        <ul style="padding-left:1.2rem;">${insights.map(i => `<li style="margin: .25rem 0;">${i}</li>`).join("")}</ul>
      </section>

      <section class="mt-6">
        <h2 style="font-weight:800;font-size:1.4rem;">5. Audit trail (last 20 entries)</h2>
        <div class="data-table-container">
          <table class="data-table"><thead><tr><th>Timestamp</th><th>Action</th><th>Details</th><th>Hash</th></tr></thead>
          <tbody>${DAWF.state.auditLog.slice(-20).reverse().map(e => `<tr><td>${new Date(e.ts).toLocaleString()}</td><td><span class="pill pill-info">${e.action}</span></td><td>${e.details}</td><td class="font-mono text-xs" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.hash}</td></tr>`).join("")}</tbody></table>
        </div>
      </section>

      <footer style="margin-top:3rem; padding-top:1rem; border-top:2px solid var(--border); display:flex; justify-content:space-between; font-size:.8rem; color: var(--text-muted);">
        <div>
          <p>Processing: Browser RAM &amp; IndexedDB (client-side)</p>
          <p>Compliance: Zero-server / zero-AI-API architecture</p>
          <p>Engine: DAWF Hub v${DAWF.version}</p>
        </div>
        <div class="text-right">
          <div style="border-bottom:1px solid #000; width:200px; margin-bottom:.3rem;"></div>
          <p class="text-xs uppercase font-bold">Authorised analyst signature</p>
        </div>
      </footer>`;
    document.getElementById("report").innerHTML = html;
    if (window.lucide) lucide.createIcons();

    document.getElementById("btnPrint").onclick = () => window.print();
    document.getElementById("btnMd").onclick = () => {
      const md = `# ${brand.name}\n\n*${brand.tagline}*\n\nReport generated ${date}\n\n## 1. Executive summary\n\nDataset **${DAWF.state.activeFile}** — ${ov.rowCount} rows × ${ov.colCount} columns. Quality score: **${q.score}/100**.\n\n## 2. Quality audit\n\n- Missing: ${ov.missingPct.toFixed(1)}%\n- Duplicates: ${q.duplicates}\n- Outlier columns: ${q.outlierColumns}\n\n## 3. Key metrics\n\n${DAWF.exportEngine.toMarkdown(top3)}\n\n## 4. Insights\n\n${insights.map(i => "- " + i).join("\n")}\n`;
      DAWF.download("report.md", new Blob([md], { type: "text/markdown" }));
    };
    document.getElementById("btnHtml").onclick = () => {
      const full = `<!doctype html><html><head><meta charset="utf-8"><title>${brand.name} Report</title><link rel="stylesheet" href="css/style.css"></head><body class="page-container">${document.getElementById("report").outerHTML}</body></html>`;
      DAWF.download("report.html", new Blob([full], { type: "text/html" }));
    };
  })();
  </script>
</body>
</html>
